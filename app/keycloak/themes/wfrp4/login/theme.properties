# Thème de connexion WFRP4 « Vieux Monde » : hérite de keycloak.v2 (PatternFly 5),
# ne remplace que les couleurs, les polices, les textes et le lien d'inscription.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/wfrp4.css

# Page d'inscription de l'application (le formulaire natif Keycloak reste désactivé).
wfrp4InscriptionUrl=${env.WFRP4_APP_URL:http://localhost:5080}/inscription

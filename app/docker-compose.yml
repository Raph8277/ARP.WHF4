services:
  postgres:
    image: postgres:16-alpine
    container_name: wfrp4-postgres
    environment:
      POSTGRES_USER: wfrp4
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: wfrp4_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wfrp4 -d wfrp4_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: wfrp4-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: wfrp4
      KC_DB_PASSWORD: changeme
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy

  wfrp4-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wfrp4-app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Wfrp4: "Host=postgres;Port=5432;Database=wfrp4_dev;Username=wfrp4;Password=changeme"
      Keycloak__Authority: "http://localhost:8080/realms/wfrp4"
      Keycloak__Audience: "wfrp4-api"
      Keycloak__ValidIssuer: "http://localhost:8080/realms/wfrp4"
      Keycloak__BackchannelAuthority: "http://host.docker.internal:8080"
      Keycloak__Realm: "wfrp4"
      Keycloak__AdminClientId: "wfrp4-admin-service"
      Keycloak__AdminClientSecret: "${WFRP4_KEYCLOAK_ADMIN_SECRET:-dev-admin-secret-change-me}"
    ports:
      - "5080:8081"
    volumes:
      - ./src/Wfrp4.Server/PdfTemplates:/app/PdfTemplates
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  pgdata:
